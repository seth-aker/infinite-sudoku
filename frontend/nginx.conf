server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:js|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }
    location ~ /\. {
      return 404;
    }
    location ~* \.(?:php|env|git|sql|bak|ya?ml|ini|conf)$ {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
